# AI Automation Pack for TPE/PME
# Phase 11 — infrastructure + backend + frontend React (profile app retiré).

name: ai-automation-pack

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    container_name: aipack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aipack}
      POSTGRES_USER: ${POSTGRES_USER:-aipack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aipack-dev-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aipack} -d ${POSTGRES_DB:-aipack}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - aipack

  n8n:
    image: n8nio/n8n:1.107.4
    container_name: aipack-n8n
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      GENERIC_TIMEZONE: Europe/Paris
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-n8n-encryption-key-32b}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_RUNNERS_ENABLED: "true"
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change-me-webhook-secret-min-16-chars}
      BACKEND_BASE_URL: http://backend:8080
      DEMO_COMPANY_ID: ${DEMO_COMPANY_ID:-aaaaaaaa-0000-4000-8000-000000000001}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${N8N_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-aipack}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-aipack-dev-change-me}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - aipack

  ollama:
    image: ollama/ollama:0.11.10
    container_name: aipack-ollama
    restart: unless-stopped
    environment:
      # Garde le modèle en mémoire (évite un rechargement CPU ~30–120 s à chaque cold start).
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:--1}"
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - aipack

  ollama-init:
    image: ollama/ollama:0.11.10
    container_name: aipack-ollama-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "Pulling Ollama model $$OLLAMA_MODEL..."
        ollama pull "$$OLLAMA_MODEL"
        echo "Warming $$OLLAMA_MODEL (first inference)..."
        ollama run "$$OLLAMA_MODEL" "Réponds uniquement: OK" >/tmp/ollama-warm.txt 2>&1 || true
        echo "Ollama model ready."
    networks:
      - aipack

  mailpit:
    image: axllent/mailpit:v1.27.4
    container_name: aipack-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8025/api/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - aipack

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: aipack-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin-change-me}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - aipack

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    container_name: aipack-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin-change-me}
      MINIO_BUCKET: ${MINIO_BUCKET:-aipack}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing "local/$$MINIO_BUCKET"
    networks:
      - aipack

  redis:
    image: redis:7.4-alpine
    container_name: aipack-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - aipack

  # Spring Boot — Phase 2.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ai-automation-pack-backend:local
    container_name: aipack-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret-min-32-characters-long}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change-me-webhook-secret-min-16-chars}
      AI_GENERATED_EMAIL_AUTO_SEND: ${AI_GENERATED_EMAIL_AUTO_SEND:-false}
      INVOICE_REMINDER_AUTO_SEND: ${INVOICE_REMINDER_AUTO_SEND:-false}
      DAILY_REPORT_AUTO_SEND: ${DAILY_REPORT_AUTO_SEND:-false}
      DAILY_REPORT_FROM: ${DAILY_REPORT_FROM:-rapports@demo.aipack.example}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aipack}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-aipack}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-aipack-dev-change-me}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_TIMEOUT: ${AI_TIMEOUT:-900s}
      AI_OPENAI_BASE_URL: ${AI_OPENAI_BASE_URL:-https://api.openai.com/v1}
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
      AI_OPENAI_MODEL: ${AI_OPENAI_MODEL:-gpt-4o-mini}
      AI_OPENAI_JSON_MODE: ${AI_OPENAI_JSON_MODE:-true}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin-change-me}
      MINIO_BUCKET: ${MINIO_BUCKET:-aipack}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 75s
    networks:
      - aipack

  # Spring Boot dashboard React — Phase 11.
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ai-automation-pack-frontend:local
    container_name: aipack-frontend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - aipack

  n8n-init:
    image: n8nio/n8n:1.107.4
    container_name: aipack-n8n-init
    restart: "no"
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-n8n-encryption-key-32b}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "false"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${N8N_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-aipack}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-aipack-dev-change-me}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./n8n/import.sh:/import.sh:ro
    entrypoint: ["/bin/sh", "/import.sh"]
    networks:
      - aipack

  # reverse-proxy (Caddy) — optionnel, profile "proxy" (PRD : esquissé, off par défaut)
  reverse-proxy:
    profiles: ["proxy"]
    image: caddy:2.9-alpine
    container_name: aipack-caddy
    restart: unless-stopped
    ports:
      - "${PROXY_HTTP_PORT:-8088}:80"
      - "${PROXY_HTTPS_PORT:-8443}:443"
    environment:
      PROXY_SITE: ${PROXY_SITE:-:80}
      PROXY_ACME_EMAIL: ${PROXY_ACME_EMAIL:-}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks:
      - aipack

networks:
  aipack:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
  ollama_data:
  minio_data:
  redis_data:
  caddy_data:
  caddy_config:
