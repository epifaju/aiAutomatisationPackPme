# E2E CI — Docker Compose + Playwright (PRD §40 / §40bis)
# Uses llama3.2:1b (CPU-friendly). Scenario B is strict in CI (no AI skip).
name: e2e

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env
        run: |
          cp .env.example .env
          # Free host ports for GitHub runners; keep internal compose networking.
          sed -i 's/^POSTGRES_PORT=.*/POSTGRES_PORT=5432/' .env
          sed -i 's/^N8N_PORT=.*/N8N_PORT=5678/' .env
          sed -i 's/^N8N_WEBHOOK_URL=.*/N8N_WEBHOOK_URL=http:\/\/localhost:5678\//' .env
          sed -i 's/^BACKEND_PORT=.*/BACKEND_PORT=8080/' .env
          sed -i 's/^FRONTEND_PORT=.*/FRONTEND_PORT=5173/' .env
          sed -i 's/^MAILPIT_SMTP_HOST_PORT=.*/MAILPIT_SMTP_HOST_PORT=1025/' .env
          sed -i 's/^MAILPIT_UI_PORT=.*/MAILPIT_UI_PORT=8025/' .env
          sed -i 's/^OLLAMA_MODEL=.*/OLLAMA_MODEL=llama3.2:1b/' .env
          sed -i 's/^AI_TIMEOUT=.*/AI_TIMEOUT=600s/' .env
          sed -i 's/^E2E_AI_TIMEOUT_MS=.*/E2E_AI_TIMEOUT_MS=420000/' .env
          grep -q '^E2E_AI_TIMEOUT_MS=' .env || echo 'E2E_AI_TIMEOUT_MS=420000' >> .env
          echo 'E2E_STRICT_AI=1' >> .env

      - name: Start stack
        run: |
          docker compose up -d postgres n8n ollama mailpit minio redis backend frontend --wait
          docker compose up minio-init ollama-init n8n-init
          docker compose restart n8n
          docker compose up -d n8n --wait

      - name: Warm Ollama model
        run: |
          MODEL=$(grep -E '^OLLAMA_MODEL=' .env | cut -d= -f2-)
          echo "Warming $MODEL"
          for i in $(seq 1 5); do
            if curl -fsS http://localhost:11434/api/tags | grep -q "$MODEL\|llama3.2"; then
              break
            fi
            echo "waiting for model tags… ($i)"
            sleep 10
          done
          curl -fsS http://localhost:11434/api/generate \
            -H 'Content-Type: application/json' \
            -d "{\"model\":\"${MODEL}\",\"prompt\":\"OK\",\"stream\":false,\"keep_alive\":-1,\"options\":{\"num_predict\":8}}" \
            --max-time 300 \
            | head -c 200
          echo

      - name: Wait for frontend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:5173/healthz" | grep -q ok; then
              echo "frontend ready"
              exit 0
            fi
            sleep 5
          done
          echo "frontend not ready"
          docker compose ps
          docker compose logs --tail=80 frontend backend
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: tests/e2e
        env:
          E2E_AI_TIMEOUT_MS: "420000"
          E2E_STRICT_AI: "1"
          OLLAMA_MODEL: "llama3.2:1b"
          CI: "true"
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v
