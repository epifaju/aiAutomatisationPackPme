server:
  port: 8080

app:
  env: ${APP_ENV:development}
  base-url: ${APP_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    secret: ${JWT_SECRET:change-me-jwt-secret-min-32-characters-long}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  webhook:
    secret: ${WEBHOOK_SECRET:change-me-webhook-secret-min-16-chars}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    trust-forwarded-headers: ${RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}
    auth:
      capacity: ${RATE_LIMIT_AUTH_CAPACITY:20}
      refill-period: ${RATE_LIMIT_AUTH_REFILL:1m}
    webhook:
      capacity: ${RATE_LIMIT_WEBHOOK_CAPACITY:120}
      refill-period: ${RATE_LIMIT_WEBHOOK_REFILL:1m}
  email:
    auto-send: ${AI_GENERATED_EMAIL_AUTO_SEND:false}
  storage:
    provider: ${STORAGE_PROVIDER:minio}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin-change-me}
    bucket: ${MINIO_BUCKET:aipack}
  documents:
    max-size-bytes: ${DOCUMENT_MAX_SIZE_BYTES:20971520}
    ocr-enabled: ${DOCUMENT_OCR_ENABLED:true}
    ocr-languages: ${DOCUMENT_OCR_LANGUAGES:fra+eng}
    ocr-min-chars: ${DOCUMENT_OCR_MIN_CHARS:40}
  clamav:
    enabled: ${CLAMAV_ENABLED:false}
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
    timeout: ${CLAMAV_TIMEOUT:10s}
    fail-open: ${CLAMAV_FAIL_OPEN:true}
  invoices:
    auto-send: ${INVOICE_REMINDER_AUTO_SEND:false}
    scheduler-enabled: ${INVOICE_REMINDER_SCHEDULER_ENABLED:true}
    from-address: ${INVOICE_REMINDER_FROM:relances@demo.aipack.example}
  reports:
    auto-send: ${DAILY_REPORT_AUTO_SEND:false}
    scheduler-enabled: ${DAILY_REPORT_SCHEDULER_ENABLED:true}
    from-address: ${DAILY_REPORT_FROM:rapports@demo.aipack.example}
  ai:
    provider: ${AI_PROVIDER:ollama}
    timeout: ${AI_TIMEOUT:120s}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:llama3.2}
    openai:
      base-url: ${AI_OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${AI_OPENAI_API_KEY:}
      model: ${AI_OPENAI_MODEL:gpt-4o-mini}
      json-mode: ${AI_OPENAI_JSON_MODE:true}
    cache:
      enabled: ${AI_CACHE_ENABLED:true}
      ttl: ${AI_CACHE_TTL:1h}
      redis-host: ${REDIS_HOST:localhost}
      redis-port: ${REDIS_PORT:6379}

spring:
  application:
    name: ai-automation-pack-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aipack}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:aipack}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:aipack-dev-change-me}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${DOCUMENT_MAX_SIZE_BYTES:20971520}
      max-request-size: ${DOCUMENT_MAX_SIZE_BYTES:20971520}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

info:
  app:
    name: ${spring.application.name}
    env: ${app.env}
