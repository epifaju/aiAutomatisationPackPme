server:
  port: 8080

app:
  env: ${APP_ENV:development}
  base-url: ${APP_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    secret: ${JWT_SECRET:change-me-jwt-secret-min-32-characters-long}
    access-token-ttl: 15m
    refresh-token-ttl: 7d

spring:
  application:
    name: ai-automation-pack-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aipack}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:aipack}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:aipack-dev-change-me}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

info:
  app:
    name: ${spring.application.name}
    env: ${app.env}
