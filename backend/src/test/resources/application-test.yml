spring:
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed

app:
  jwt:
    secret: test-jwt-secret-must-be-32-chars-min
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  webhook:
    secret: test-webhook-secret-16
  rate-limit:
    enabled: true
    trust-forwarded-headers: false
    auth:
      capacity: 1000
      refill-period: 1m
    webhook:
      capacity: 1000
      refill-period: 1m
  email:
    auto-send: false
  storage:
    provider: memory
    endpoint: http://localhost:9000
    access-key: test
    secret-key: test-secret
    bucket: aipack-test
  documents:
    max-size-bytes: 20971520
    ocr-enabled: false
    ocr-languages: fra+eng
    ocr-min-chars: 40
  invoices:
    auto-send: false
    scheduler-enabled: false
    from-address: relances@demo.aipack.example
  reports:
    auto-send: false
    scheduler-enabled: false
    from-address: rapports@demo.aipack.example
  ai:
    cache:
      enabled: false
  clamav:
    enabled: false
    fail-open: true

